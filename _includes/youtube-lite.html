<script>
window.ytLitePlay = window.ytLitePlay || function (btn) {
  var box = btn.parentNode, id = btn.getAttribute('data-yt'), holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
  box.replaceChild(holder, btn);
  function make() {
    new YT.Player(holder, {
      videoId: id, width: '100%', height: '100%', host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 1, rel: 0, playsinline: 1, cc_load_policy: 1, cc_lang_pref: 'ko', hl: 'ko' },
      events: {
        onReady: function (e) { e.target.playVideo(); },
        onApiChange: function (e) { try { e.target.setOption('captions', 'fontSize', 2); } catch (err) {} }
      }
    });
  }
  if (window.YT && window.YT.Player) { make(); return; }
  window.ytLiteQueue = window.ytLiteQueue || [];
  window.ytLiteQueue.push(make);
  if (!window.ytLiteLoading) {
    window.ytLiteLoading = true;
    window.onYouTubeIframeAPIReady = function () { window.ytLiteQueue.forEach(function (f) { f(); }); };
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
};
</script>
<div class="yt-lite-wrap" style="position: relative; max-width: 480px; aspect-ratio: 4 / 5; margin: 24px auto 10px auto; border-radius: 12px; overflow: hidden; background: #000;">
  <button type="button" aria-label="{{ include.title }} 재생" data-yt="{{ include.id }}" onclick="ytLitePlay(this)" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; background: #000;">
    <img src="{{ include.poster }}" alt="{{ include.alt }}" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover; margin: 0;">
    <span aria-hidden="true" style="position: absolute; top: 50%; left: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(255, 0, 0, 0.9); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);"><span style="position: absolute; top: 50%; left: 50%; margin: -13px 0 0 -8px; border-style: solid; border-width: 13px 0 13px 22px; border-color: transparent transparent transparent #fff;"></span></span>
  </button>
</div>
<p style="text-align: center; font-size: 14px; color: #666; margin: 0 0 24px 0;">AI 튜터가 대화를 어떻게 이끌어가는지 영상으로 확인해 보세요.<br>※ 폰 스픽 통화에서는 튜터가 대답하기까지 약 5초 정도 딜레이가 있는데, 영상에서는 이 부분을 편집으로 잘라냈어요.</p>
