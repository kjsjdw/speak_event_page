<div class="yt-lite-wrap" style="position: relative; max-width: 400px; aspect-ratio: 4 / 5; margin: 24px auto 10px auto; border-radius: 12px; overflow: hidden; background: #000;">
  <button type="button" aria-label="{{ include.title }} 재생" data-yt="{{ include.id }}" onclick="var f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+this.getAttribute('data-yt')+'?autoplay=1&amp;rel=0&amp;playsinline=1';f.title=this.getAttribute('aria-label');f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;f.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;border:0;';this.parentNode.replaceChild(f,this);" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; background: #000;">
    <img src="{{ include.poster }}" alt="{{ include.alt }}" loading="lazy" style="display: block; width: 100%; height: 100%; object-fit: cover; margin: 0;">
    <span aria-hidden="true" style="position: absolute; top: 50%; left: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border-radius: 50%; background: rgba(255, 0, 0, 0.9); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);"><span style="position: absolute; top: 50%; left: 50%; margin: -13px 0 0 -8px; border-style: solid; border-width: 13px 0 13px 22px; border-color: transparent transparent transparent #fff;"></span></span>
  </button>
</div>
<p style="text-align: center; font-size: 14px; color: #666; margin: 0 0 24px 0;">※ 폰 스픽 통화에서는 튜터가 대답하기까지 약 5초 정도 딜레이가 있어요.</p>
